name: Build and deploy

# Sundays at 04:30 UTC: 30 min after nba-data-archive weekly refresh.
on:
  schedule:
    - cron: "30 4 * * 0"
  workflow_dispatch:
    inputs:
      skip_catalog:
        description: "Skip catalog rebuild (faster if catalog hasn't changed)"
        type: boolean
        default: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write    # release create/upload, optional catalog commit

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build player catalog
        if: ${{ inputs.skip_catalog != true }}
        run: python scripts/build_player_catalog.py

      - name: Verify catalog exists
        run: |
          test -f data/players.json
          ls -la data/players.json

      - name: Build shot shards
        run: python scripts/build_shot_shards.py

      - name: Verify dist looks sane
        run: |
          test -f dist/players.json
          test -f dist/format.json
          shard_count=$(find dist/players -name "*.json" | wc -l)
          echo "Shard count: $shard_count"
          if [ "$shard_count" -lt 2000 ]; then
            echo "ERROR: too few shards ($shard_count); something went wrong" >&2
            exit 1
          fi
          du -sh dist

      - name: Commit catalog on main if changed
        run: |
          if git diff --quiet data/players.json; then
            echo "Catalog unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/players.json
            git commit -m "Auto: refresh player catalog"
            git push origin main
          fi

      # Bundle every shard into a structured tarball. Single large asset
      # uploads much faster than 2,840 small ones and the unpacked layout
      # is preserved when consumers extract it. The tarball goes alongside
      # the per-file assets so people can choose.
      - name: Build tarball of all shards
        run: |
          cd dist
          tar czf shot-chart-data.tar.gz players.json format.json players
          ls -la shot-chart-data.tar.gz
          cd ..

      # Create or refresh the "data" release. Using --clobber via gh release
      # upload lets us replace asset files in place each week without
      # creating new tags. This keeps URLs stable across rebuilds:
      #   .../releases/download/data/players.json
      #   .../releases/download/data/players/25/2544.json
      - name: Ensure 'data' release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view data --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create data \
              --repo "${{ github.repository }}" \
              --title "Shot Chart Studio Data" \
              --notes "Per-player shot shards, catalog, and schema. Refreshed weekly. See README for download patterns."
          fi

      - name: Upload root files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload data \
            dist/players.json \
            dist/format.json \
            dist/shot-chart-data.tar.gz \
            --repo "${{ github.repository }}" \
            --clobber

      # Per-player files: too many to enumerate in one gh upload call (cmdline
      # arg limit hits hard at ~2840 paths). We batch them.
      - name: Upload per-player shards to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # We use the path-prefixed name pattern players__<prefix>__<id>.json
          # in the release because GitHub Release assets share a flat
          # namespace (no slashes allowed in asset names). The app rewrites
          # the path accordingly when it builds URLs.
          mkdir -p flat
          find dist/players -name "*.json" -type f | while read -r f; do
            rel="${f#dist/players/}"            # e.g. "25/2544.json"
            flat_name="players__${rel//\//__}"  # e.g. "players__25__2544.json"
            cp "$f" "flat/$flat_name"
          done
          total=$(ls flat | wc -l)
          echo "Prepared $total flat asset files"

          # Batch uploads. gh release upload accepts many files per call
          # but cmdline length caps how many.
          ls flat/*.json | xargs -n 200 gh release upload data \
            --repo "${{ github.repository }}" --clobber

      - name: Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Release page:"
          echo "  https://github.com/${{ github.repository }}/releases/tag/data"
          echo "Asset URL pattern (per-player):"
          echo "  https://github.com/${{ github.repository }}/releases/download/data/players__<prefix>__<id>.json"
          echo "Catalog URL:"
          echo "  https://github.com/${{ github.repository }}/releases/download/data/players.json"
