name: Build and deploy

# Sundays at 04:30 UTC: 30 min after nba-data-archive weekly refresh.
on:
  schedule:
    - cron: "30 4 * * 0"
  workflow_dispatch:
    inputs:
      skip_catalog:
        description: "Skip catalog rebuild (faster if catalog hasn't changed)"
        type: boolean
        default: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write    # may auto-commit catalog updates

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build player catalog
        if: ${{ inputs.skip_catalog != true }}
        run: python scripts/build_player_catalog.py

      - name: Verify catalog exists
        run: |
          test -f data/players.json
          ls -la data/players.json

      - name: Build shot shards
        run: python scripts/build_shot_shards.py

      - name: Verify dist looks sane
        run: |
          test -f dist/shot-chart-shards/players.json
          test -f dist/shot-chart-shards/format.json
          shard_count=$(find dist/shot-chart-shards/players -name "*.json" | wc -l)
          echo "Shard count: $shard_count"
          if [ "$shard_count" -lt 2000 ]; then
            echo "ERROR: too few shards ($shard_count); something went wrong" >&2
            exit 1
          fi
          du -sh dist/shot-chart-shards

      - name: Commit catalog on main if changed
        run: |
          if git diff --quiet data/players.json; then
            echo "Catalog unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/players.json
            git commit -m "Auto: refresh player catalog"
            git push origin main
          fi

      # Upload everything under dist/shot-chart-shards/ to the
      # cdechoch/nba-data-archive HF dataset, under a top-level
      # shot-chart-shards/ directory. upload_large_folder handles retries
      # and the xet backend uploads in parallel, so 2,840 small files
      # finish in a few minutes total.
      - name: Push shards to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python <<'PYEOF'
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi()
          folder = Path("dist/shot-chart-shards")
          assert folder.exists(), f"missing {folder}"

          # Upload the entire local subtree into a path-with-prefix on HF.
          # path_in_repo causes HF to mirror our local layout there:
          #   shot-chart-shards/players.json
          #   shot-chart-shards/players/25/2544.json
          api.upload_large_folder(
              repo_id="cdechoch/nba-data-archive",
              repo_type="dataset",
              folder_path=str(folder),
              path_in_repo="shot-chart-shards",
          )
          print("Done.")
          print("Catalog URL:")
          print("  https://huggingface.co/datasets/cdechoch/nba-data-archive/resolve/main/shot-chart-shards/players.json")
          print("Per-player URL pattern:")
          print("  https://huggingface.co/datasets/cdechoch/nba-data-archive/resolve/main/shot-chart-shards/players/<prefix>/<id>.json")
          PYEOF
